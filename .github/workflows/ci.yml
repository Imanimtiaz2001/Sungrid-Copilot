name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]
    env:
      # deterministic + key-free: CI never needs secrets
      EMBEDDING_PROVIDER: hashing
      LLM_PROVIDER: none
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: pip install -r requirements-dev.txt && pip install -e . --no-deps
      - run: ruff check src tests
      - run: pytest
      - name: Golden-set quality gates
        run: sungrid eval --strict --out reports-ci
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: eval-report-py${{ matrix.python-version }}
          path: reports-ci/
