[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sungrid-copilot"
version = "1.0.0"
description = "SunGrid Cooperative member-support copilot: category-filtered hybrid RAG + an eligibility agent with a hard gate."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.26",
  "scipy>=1.11",
  "scikit-learn>=1.4",
  "rank-bm25>=0.2.2",
  "qdrant-client>=1.12,<2",
  "fastembed>=0.4",
  "pydantic>=2.6",
  "pydantic-settings>=2.2",
  "pyyaml>=6.0",
  "typer>=0.12",
  "rich>=13.7",
  "openai>=1.40",
  "anthropic>=0.40",
  "fastapi>=0.110",
  "uvicorn>=0.29",
]

[project.optional-dependencies]
dev = ["pytest>=8", "hypothesis>=6.100", "ruff>=0.5", "httpx>=0.27"]

[project.scripts]
sungrid = "sungrid_copilot.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 120
target-version = "py310"
src = ["src", "tests"]
extend-exclude = ["src/sungrid_copilot/vendor"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
ignore = ["E501", "B008", "B905", "SIM905"]
